<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>拾叁创作工作台</title>
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4eedc;--card-bg:#fffbf0;--card-hover:#fff8e5;
  --border:#e8dfc8;--text:#2c2c2c;--text-dim:#8b8478;--text-muted:#b8b0a0;
  --accent:#d4745c;--accent-dim:rgba(212,116,92,.1);
  --blue:#5b8cbf;--blue-dim:rgba(91,140,191,.1);
  --green:#6b9e7a;--green-dim:rgba(107,158,122,.1);
  --yellow:#c4a24c;--yellow-dim:rgba(196,162,76,.15);
  --purple:#8b7aaf;--purple-dim:rgba(139,122,175,.12);
  --radius:14px;--radius-sm:10px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 2px 8px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.05);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif
}
html{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100%;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent)}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}

/* === LAYOUT === */
.app{padding:32px 40px;max-width:1280px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:14px}
.header-icon{width:42px;height:42px;background:linear-gradient(135deg,#d4745c,#e8946a);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 2px 8px rgba(212,116,92,.2)}
.header h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.header .date{font-size:.8rem;color:var(--text-muted);margin-top:2px}
.header-actions{display:flex;gap:8px}

/* === BUTTONS === */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-xs);font-size:.82rem;font-weight:500;transition:all .15s;white-space:nowrap;letter-spacing:.01em}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#c56852}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.btn-ghost:hover{background:var(--card-hover);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:.76rem}
.btn-xs{padding:3px 8px;font-size:.72rem}
.btn-danger{background:transparent;border:1px solid rgba(200,80,60,.2);color:#c8503c}
.btn-danger:hover{background:rgba(200,80,60,.08)}

/* === STATS === */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:.76rem;color:var(--text-dim);margin-bottom:4px;letter-spacing:.02em}
.stat-value{font-size:1.8rem;font-weight:700;letter-spacing:-.02em}
.stat-value.accent{color:var(--accent)}
.stat-value.blue{color:var(--blue)}
.stat-value.green{color:var(--green)}
.stat-value.yellow{color:var(--yellow)}

/* === TABS === */
.tabs{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;font-size:.84rem;font-weight:500;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;letter-spacing:.01em;border-radius:var(--radius-xs) var(--radius-xs) 0 0}
.tab:hover{color:var(--text);background:var(--card-hover)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:transparent}
.tab-count{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--border);font-size:.7rem;color:var(--text-dim);min-width:20px;text-align:center}

/* === PANELS === */
.panel{display:none}
.panel.active{display:block}

/* === SECTION === */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.section-header h2{font-size:1.05rem;font-weight:600;letter-spacing:-.005em}

/* === PROJECT CARDS === */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.project-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .18s;cursor:pointer;position:relative;overflow:hidden}
.project-card:hover{border-color:var(--blue);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.project-card .card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.project-card .project-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.project-card .project-name{font-size:.92rem;font-weight:600;margin-bottom:4px;line-height:1.3}
.project-card .project-date{font-size:.72rem;color:var(--text-muted);margin-bottom:8px}
.project-card .project-meta{display:flex;gap:12px;font-size:.74rem;color:var(--text-dim);margin-bottom:6px}
.project-card .project-meta span{display:flex;align-items:center;gap:4px}
.project-card .project-note{font-size:.74rem;color:var(--text-muted);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.project-card .card-footer{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.7rem;font-weight:500;letter-spacing:.01em}
.badge-active{background:var(--yellow-dim);color:var(--yellow)}
.badge-draft{background:var(--text-muted);color:#fff;opacity:.8}
.badge-done{background:var(--green-dim);color:var(--green)}
.badge-idea{background:var(--purple-dim);color:var(--purple)}

/* === SCRIPTS === */
.scripts-list{display:flex;flex-direction:column;gap:8px}
.script-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.script-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;transition:background .15s}
.script-header:hover{background:var(--card-hover)}
.script-title{font-weight:500;font-size:.9rem;display:flex;align-items:center;gap:8px}
.script-meta{display:flex;gap:12px;align-items:center;font-size:.76rem;color:var(--text-dim)}
.script-arrow{color:var(--text-muted);transition:transform .2s;font-size:.8rem}
.script-item.open .script-arrow{transform:rotate(180deg)}
.script-body{display:none;border-top:1px solid var(--border);padding:20px}
.script-item.open .script-body{display:block}
/* 脚本子标签 */
.sc-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)}
.sc-tab{padding:8px 18px;font-size:.82rem;font-weight:500;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s}
.sc-tab:hover{color:var(--text)}
.sc-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sc-pane{display:none}
.sc-pane.active{display:block}
.sc-narration{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;font-size:.84rem;line-height:1.8;color:var(--text);white-space:pre-wrap;font-family:var(--font)}
.sc-narration-section{margin-bottom:14px}
.sc-narration-section:last-child{margin-bottom:0}
.sc-narration-label{font-size:.72rem;font-weight:600;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
.sc-download-btn{margin-top:12px}
.shot-table{width:100%;border-collapse:collapse;font-size:.82rem}
.shot-table th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);color:var(--text-dim);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em}
.shot-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.shot-table tr:last-child td{border-bottom:none}
.shot-table .shot-num{width:60px;color:var(--accent);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.shot-num-input{width:60px;text-align:center}
.add-shot-row{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);align-items:center}
.add-shot-row input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:.82rem;outline:none}
.add-shot-row input:focus{border-color:var(--accent)}
.shot-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}

/* === IDEAS === */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.idea-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:all .15s;cursor:pointer}
.idea-card:hover{border-color:var(--purple)}
.idea-card .idea-priority{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.idea-card .idea-priority.high{background:var(--accent)}
.idea-card .idea-priority.medium{background:var(--yellow)}
.idea-card .idea-priority.low{background:var(--text-muted)}
.idea-card .idea-title{font-size:.88rem;font-weight:500;margin-bottom:6px}
.idea-card .idea-desc{font-size:.78rem;color:var(--text-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.idea-card .idea-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.7rem;color:var(--text-muted)}
.idea-card .idea-tag{display:inline-block;padding:2px 8px;background:var(--purple-dim);border-radius:8px;color:var(--purple);font-size:.68rem}
.idea-card .idea-source{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:8px;font-size:.68rem;font-weight:500;text-decoration:none}
.idea-card .idea-source.douyin{background:#000;color:#fff}
.idea-card .idea-source.xhs{background:#ff2442;color:#fff}
.idea-card .idea-source.web{background:var(--blue-dim);color:var(--blue)}

/* === ACCOUNT COLUMNS === */
.acct-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.acct-col{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.acct-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.acct-header .acct-icon{font-size:18px;margin-right:8px}
.acct-header .acct-name{font-size:.88rem;font-weight:600}
.acct-header .acct-cat{font-size:.7rem;color:var(--text-dim);margin-top:2px;line-height:1.3}
.acct-header .acct-count{background:var(--border);padding:2px 8px;border-radius:10px;font-size:.7rem;color:var(--text-dim);min-width:22px;text-align:center}
.acct-body{padding:12px;flex:1;overflow-y:auto;max-height:520px}
.acct-body::-webkit-scrollbar{width:3px}
.acct-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.acct-mini-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;transition:all .15s;cursor:pointer}
.acct-mini-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.acct-mini-card .mc-title{font-size:.82rem;font-weight:600;line-height:1.4;margin-bottom:6px}
.acct-mini-card .mc-content{font-size:.74rem;color:var(--text-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.acct-mini-card .mc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.acct-mini-card .mc-tag{display:inline-block;padding:1px 7px;background:var(--purple-dim);border-radius:6px;color:var(--purple);font-size:.64rem}
.acct-mini-card .mc-source{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:.64rem;font-weight:500;text-decoration:none}
.acct-mini-card .mc-source.douyin{background:#000;color:#fff}
.acct-mini-card .mc-source.xhs{background:#ff2442;color:#fff}
.acct-mini-card .mc-source.web{background:var(--blue-dim);color:var(--blue)}
.acct-empty{text-align:center;padding:24px 12px;color:var(--text-muted);font-size:.78rem}

/* === ACCOUNT SELECTOR === */
.acct-select{display:flex;gap:6px;margin-bottom:12px}
.acct-select-btn{flex:1;padding:10px 14px;border-radius:var(--radius-xs);font-size:.82rem;font-weight:500;transition:all .15s;border:2px solid var(--border);background:var(--card-bg);color:var(--text-dim);text-align:center;cursor:pointer}
.acct-select-btn:hover{border-color:var(--text-dim);color:var(--text)}
.acct-select-btn.active{color:#fff}
.acct-select-btn.active[data-acct="wsy"]{background:var(--accent);border-color:var(--accent)}
.acct-select-btn.active[data-acct="wmxz"]{background:var(--purple);border-color:var(--purple)}
.acct-select-btn.active[data-acct="zfdg"]{background:var(--green);border-color:var(--green)}

/* === LINKS === */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.link-card{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:all .15s;cursor:pointer;color:var(--text);text-decoration:none;font-size:.84rem}
.link-card:hover{border-color:var(--blue);color:var(--text)}
.link-card .link-icon{font-size:20px;flex-shrink:0}
.link-card .link-name{font-weight:500;flex:1}
.link-card .link-type{font-size:.68rem;color:var(--text-muted)}

/* === MODAL === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{margin-bottom:18px;font-size:1.05rem;font-weight:600}
.modal .form-group{margin-bottom:14px}
.form-row{display:flex;gap:14px}.form-row .form-group{flex:1}
.modal label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:4px;letter-spacing:.01em}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:.84rem;outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent)}
.modal textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* === EMPTY === */
.empty-state{text-align:center;padding:40px 24px;color:var(--text-muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:.6}
.empty-state p{margin-bottom:14px;font-size:.84rem}

/* === RESPONSIVE === */
@media(max-width:768px){
  .app{padding:16px 20px}
  .header{flex-direction:column;align-items:flex-start;gap:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .projects-grid{grid-template-columns:1fr}
  .ideas-grid{grid-template-columns:1fr}
  .links-grid{grid-template-columns:1fr}
  .acct-columns{grid-template-columns:1fr}
  .acct-select{flex-direction:column}
  .tabs{overflow-x:auto;gap:0}
  .tab{padding:8px 14px;white-space:nowrap}
}
/* === KANBAN (项目进度) === */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kanban-col{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:280px}
.kanban-col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600}
.kanban-col-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:8px}
.kanban-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .15s}
.kanban-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.kanban-card .kc-title{font-size:.84rem;font-weight:600;margin-bottom:6px;line-height:1.4}
.kanban-card .kc-project{font-size:.72rem;color:var(--text-dim);margin-bottom:4px}
.kanban-card .kc-deadline{font-size:.7rem;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.kanban-card .kc-deadline.overdue{color:var(--accent);font-weight:600}
.kanban-card .kc-deadline.near{color:var(--yellow);font-weight:600}
.kanban-card .kc-note{font-size:.74rem;color:var(--text-muted);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kanban-card .kc-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}

/* === REVIEW SUMMARY === */
.review-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.engagement-bar{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:.7rem;font-weight:600}
.engagement-high{background:var(--green-dim);color:var(--green)}
.engagement-mid{background:var(--yellow-dim);color:var(--yellow)}
.engagement-low{background:rgba(200,80,60,.1);color:var(--accent)}

/* === FINANCE === */
.finance-month-nav{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.finance-month-btn{padding:6px 14px;border-radius:var(--radius-xs);font-size:.8rem;border:1px solid var(--border);background:var(--card-bg);color:var(--text-dim);cursor:pointer;transition:all .15s}
.finance-month-btn:hover{border-color:var(--text-dim);color:var(--text)}
.finance-month-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.finance-cat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.finance-cat-row:last-child{border-bottom:none}
.finance-cat-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:4px}
.finance-cat-bar-fill{height:100%;border-radius:3px;transition:width .3s}

@media(max-width:768px){
  .kanban{grid-template-columns:1fr}
  .review-summary{grid-template-columns:repeat(2,1fr)}
}

/* === SCRIPT IN COLUMNS === */
.acct-col .script-item{margin-bottom:8px}
.acct-col .script-header{padding:10px 14px}
.acct-col .script-body{padding:14px}
.acct-col .script-title{font-size:.84rem}
.acct-col .shot-table{font-size:.76rem}
.acct-col .shot-table th{padding:6px 8px}
.acct-col .shot-table td{padding:8px}
.acct-col .sc-narration{font-size:.8rem;padding:12px 14px}
.acct-col .add-shot-row input{font-size:.76rem;padding:6px 8px}
.acct-col-header-btn{margin-left:8px}

/* === REVIEW/PROGRESS/FINANCE CARDS IN COLUMNS === */
.acct-col .acct-mini-card .mc-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:.68rem;color:var(--text-muted)}
.acct-col .acct-mini-card .mc-stats span{white-space:nowrap}
.acct-col .acct-mini-card .mc-amount{font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums}

/* === CHART CONTAINERS === */
.chart-container{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.chart-container canvas{max-height:280px}
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.chart-grid .chart-container{margin-bottom:0}
@media(max-width:768px){.chart-grid{grid-template-columns:1fr}}

/* === AI ANALYSIS === */
.ai-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ai-header h3{font-size:.92rem;font-weight:600;display:flex;align-items:center;gap:6px}
.ai-badge{font-size:.68rem;padding:2px 8px;border-radius:8px;background:var(--purple-dim);color:var(--purple);font-weight:500}
.ai-content{font-size:.84rem;line-height:1.8;color:var(--text)}
.ai-content p{margin-bottom:8px}
.ai-content strong{color:var(--accent)}
.ai-suggestion{background:var(--bg);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:8px 0;font-size:.82rem}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:.82rem;padding:20px}
.ai-loading .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* === BREAKDOWN === */
.bd-stepper{display:flex;gap:0;margin-bottom:24px}
.bd-step-indicator{flex:1;text-align:center;padding:10px 8px;font-size:.78rem;color:var(--text-dim);border-bottom:3px solid var(--border);cursor:pointer;transition:all .15s}
.bd-step-indicator:hover{color:var(--text)}
.bd-step-indicator.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.bd-step-indicator.done{color:var(--green);border-bottom-color:var(--green)}
.bd-step-indicator .step-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--border);color:#fff;font-size:.68rem;line-height:22px;margin-right:4px}
.bd-step-indicator.active .step-num{background:var(--accent)}
.bd-step-indicator.done .step-num{background:var(--green)}
.bd-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-size:.84rem;line-height:1.8;white-space:pre-wrap;margin-top:14px}
.bd-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.bd-card h4{font-size:.86rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

    </div>

<!-- MODALS -->
<div class="modal-overlay" id="prjModal"><div class="modal">

<div class="modal-overlay" id="scModal"><div class="modal">

function addTeamShot(sid){
  var s=D.scripts.find(function(x){return x.id===sid});if(!s)return;
  if(!s.teamShots)s.teamShots=[];
  var row={
    no:document.getElementById('tm-no-'+sid).value.trim(),
    ref:document.getElementById('tm-ref-'+sid).value.trim(),
    shot_type:document.getElementById('tm-type-'+sid).value.trim(),
    duration:document.getElementById('tm-dur-'+sid).value.trim(),
    lens_desc:document.getElementById('tm-ldesc-'+sid).value.trim(),
    frame_content:document.getElementById('tm-fc-'+sid).value.trim(),
    voiceover:document.getElementById('tm-vo-'+sid).value.trim(),
    note:document.getElementById('tm-note-'+sid).value.trim()
  };
  if(!row.no&&!row.lens_desc&&!row.voiceover&&!row.frame_content&&!row.shot_type&&!row.duration&&!row.ref&&!row.note)return;
  s.teamShots.push(row);sv();renderScripts();US();
  setTimeout(function(){var el=document.getElementById('sc-'+sid);if(el){el.classList.add('open');scSwitchMode(sid,'team')}},50)
}
function delTeamShot(sid,i){
  var s=D.scripts.find(function(x){return x.id===sid});if(!s||!s.teamShots)return;
  s.teamShots.splice(i,1);sv();renderScripts();
  setTimeout(function(){var el=document.getElementById('sc-'+sid);if(el){el.classList.add('open');scSwitchMode(sid,'team')}},50)
}
function downloadTeamExcel(sid){
  var s=D.scripts.find(function(x){return x.id===sid});if(!s||!s.teamShots||!s.teamShots.length)return;
  /* 生成CSV（Excel兼容） */
  var csv='\ufeff'; /* BOM for UTF-8 */
  csv+=TEAM_COLS.join(',')+'\n';
  s.teamShots.forEach(function(row,i){
    var vals=[row.no||(i+1),row.ref||'',row.shot_type||'',row.duration||'',row.lens_desc||'',row.frame_content||'',row.voiceover||'',row.note||''];
    csv+=vals.map(function(v){v=String(v).replace(/"/g,'""');return v.indexOf(',')>=0||v.indexOf('\n')>=0?'"'+v+'"':v}).join(',')+'\n'
  });
  var name=(s.name||'脚本')+'拍摄脚本.csv';
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)
}
function renderNarration(s){
  if(s.sections&&s.sections.length){
    var html='<div class="sc-narration">';
    s.sections.forEach(function(sec){
      var texts=(sec.shots||[]).map(function(sh){return sh.text||''}).filter(Boolean);
      if(texts.length){
        html+='<div class="sc-narration-section"><div class="sc-narration-label">🎬 '+e(sec.part)+'</div>'+texts.join(' ')+'</div>'
      }
    });
    html+='</div>';
    html+='<button class="btn btn-primary btn-xs sc-download-btn" onclick="downloadNarration(\''+s.id+'\')">📥 下载口播文案</button>';
    return html
  }
  /* 旧格式 */
  var shots=s.shots||[];
  if(!shots.length)return '<div class="empty-state" style="padding:20px"><p style="font-size:.8rem">暂无口播文案</p></div>';
  var text=shots.map(function(sh){return sh.text||''}).filter(Boolean).join('\n\n');
  return '<div class="sc-narration">'+e(text)+'</div><button class="btn btn-primary btn-xs sc-download-btn" onclick="downloadNarration(\''+s.id+'\')">📥 下载口播文案</button>'
}
function downloadNarration(sid){
  var s=D.scripts.find(function(x){return x.id===sid});if(!s)return;
  var text='';
  if(s.sections&&s.sections.length){
    s.sections.forEach(function(sec){
      var texts=(sec.shots||[]).map(function(sh){return sh.text||''}).filter(Boolean);
      if(texts.length){text+=(text?'\n\n':'')+'【'+sec.part+'】\n'+texts.join(' ')}
    })
  }else{
    text=(s.shots||[]).map(function(sh){return sh.text||''}).filter(Boolean).join('\n\n')
  }
  var name=(s.name||'脚本')+'口播文案.txt';
  var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)
}

  var shots=s.shots||[];

  return '<table class="shot-table"><thead><tr><th>镜号</th><th>必拍镜头</th><th>对应文案</th><th style="width:60px"></th></tr></thead><tbody>'+shots.map(function(sh,i){

function addSectionShot(sid,si){
  var lens=document.getElementById('sl-'+sid+'-'+si).value.trim();
  var text=document.getElementById('st-'+sid+'-'+si).value.trim();
  if(!lens&&!text)return;
  var s=D.scripts.find(function(x){return x.id===sid});if(!s||!s.sections)return;
  if(!s.sections[si].shots)s.sections[si].shots=[];
  s.sections[si].shots.push({lens:lens,text:text});sv();renderScripts();US();
  setTimeout(function(){document.getElementById('sc-'+sid).classList.add('open')},50)
}
function delSectionShot(sid,si,i){
  var s=D.scripts.find(function(x){return x.id===sid});if(!s||!s.sections||!s.sections[si]||!s.sections[si].shots)return;
  s.sections[si].shots.splice(i,1);sv();renderScripts()
}
function addShot(sid){
  var n=document.getElementById('sn-'+sid).value.trim(),d=document.getElementById('sd-'+sid).value.trim(),t=document.getElementById('st-'+sid).value.trim();
  if(!d&&!t)return;var s=D.scripts.find(x=>x.id===sid);if(!s)return;
  if(!s.shots)s.shots=[];
  s.shots.push({shot:n||(s.shots.length+1).toString(),desc:d,text:t});sv();renderScripts();US();
  setTimeout(()=>document.getElementById('sc-'+sid).classList.add('open'),50)
}
function delShot(sid,i){var s=D.scripts.find(x=>x.id===sid);if(!s||!s.shots)return;s.shots.splice(i,1);sv();renderScripts()}

function getProjectAcct(pid){
  if(!pid)return '';
  var p=D.projects.find(function(x){return x.id===pid});
  return p?p.acct:'';
}
function getAcctByProjectName(pname){
  if(!pname)return '';
  var p=D.projects.find(function(x){return x.name===pname});
  return p?p.acct:'';
}
function getScriptAcct(s){
  if(s.pid)return getProjectAcct(s.pid);
  return s.acct||'wsy';
}

function classifyLink(link){
  /* 根据链接和标题中的关键词判断归属账号，返回 acctId 或 '' */
  if(!link)return '';
  var text=link.toLowerCase();
  /* 按关键词匹配，返回匹配最多的账号 */
  var scores={wsy:0,wmxz:0,zfdg:0};
  for(var acct in KEYWORDS){
    KEYWORDS[acct].forEach(function(kw){if(text.includes(kw.toLowerCase()))scores[acct]++})
  }
  var max=0,winner='';
  for(var a in scores){if(scores[a]>max){max=scores[a];winner=a}}
  return winner;
}

/* PLATFORM DETECT & QUICK ADD */
function detectPlatform(url){
  if(!url)return '';
  var u=url.toLowerCase();
  if(u.includes('douyin.com')||u.includes('iesdouyin.com')||u.includes('v.douyin.com'))return 'douyin';
  if(u.includes('xiaohongshu.com')||u.includes('xhslink.com'))return 'xhs';
  return 'web';
}
function quickAddIdea(){
  var link=document.getElementById('quickLinkInput').value.trim();
  if(!link)return alert('请粘贴链接');
  var platform=document.getElementById('quickLinkPlatform').value;
  if(platform==='auto')platform=detectPlatform(link);
  var pName=platform==='douyin'?'抖音':platform==='xhs'?'小红书':'网页';
  var acct=classifyLink(link);
  document.getElementById('quickLinkInput').value='';
  if(acct){
    /* 自动分类成功，直接打开编辑窗口，来源链接和标签预填 */
    OIM('记录灵感',{acct:acct,source:link,tags:[pName,'待整理']});
  }else{
    /* 无法自动分类，弹出选择器让用户选 */
    pendingLink={link:link,platform:platform,pName:pName};
    document.getElementById('pendingLinkDisplay').textContent=link;
    document.getElementById('acctSelectHint').style.display='block';
  }
}
function confirmAcct(acctId){
  if(!pendingLink)return;
  document.getElementById('acctSelectHint').style.display='none';
  /* 打开编辑窗口，来源链接和标签预填，等用户填写标题和文案后保存 */
  OIM('记录灵感',{acct:acctId,source:pendingLink.link,tags:[pendingLink.pName,'待整理']});
  pendingLink=null;
}

/* AI ANALYSIS - 智能分析 */
function analyzeReviews(){
  var reviews=(D.reviews||[]).slice().sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});
  if(reviews.length===0)return '<p style="color:var(--text-muted);font-size:.82rem">暂无复盘数据，记录后即可生成智能分析</p>';
  var analysis=[];
  var best=reviews[0],worst=reviews[reviews.length-1];
  reviews.forEach(function(r){var eng=getEngagementLevel(r);var bestEng=getEngagementLevel(best);var worstEng=getEngagementLevel(worst);if(eng>bestEng)best=r;if(eng<worstEng)worst=r;});
  var bestEng=getEngagementLevel(best),worstEng=getEngagementLevel(worst);
  analysis.push('<div class="ai-suggestion"><strong>🏆 表现最佳：</strong>'+e(best.title)+'（互动率'+bestEng.toFixed(2)+'%）'+(best.reflection?' — '+e(best.reflection):'')+'</div>');
  if(worst&&worst.id!==best.id)analysis.push('<div class="ai-suggestion"><strong>📉 待提升：</strong>'+e(worst.title)+'（互动率'+worstEng.toFixed(2)+'%）'+(worst.reflection?' — '+e(worst.reflection):'')+'</div>');
  var platStats={};
  reviews.forEach(function(r){var p=r.platform||'未知';if(!platStats[p])platStats[p]={count:0,views:0,eng:0};platStats[p].count++;platStats[p].views+=Number(r.views)||0;platStats[p].eng+=(Number(r.likes)||0)+(Number(r.comments)||0)+(Number(r.favorites)||0)+(Number(r.shares)||0);});
  var bestPlat='',bestPlatEng=0;
  Object.keys(platStats).forEach(function(p){var s=platStats[p];var avgEng=s.views>0?(s.eng/s.views*100):0;if(avgEng>bestPlatEng){bestPlatEng=avgEng;bestPlat=p}});
  if(bestPlat)analysis.push('<p><strong>📊 平台洞察：</strong>'+e(bestPlat)+'平台平均互动率最高（'+bestPlatEng.toFixed(2)+'%），建议优先在该平台发力。</p>');
  if(reviews.length>=3){
    var half=Math.floor(reviews.length/2);
    var oldRev=reviews.slice(half),newRev=reviews.slice(0,half);
    var oldAvg=oldRev.reduce(function(s,r){return s+Number(r.views||0)},0)/oldRev.length;
    var newAvg=newRev.reduce(function(s,r){return s+Number(r.views||0)},0)/newRev.length;
    var change=((newAvg-oldAvg)/oldAvg*100);
    if(isFinite(change)&&Math.abs(change)>5){
      var dir=change>0?'上升':'下降';
      analysis.push('<p><strong>📈 播放量趋势：</strong>近期作品平均播放量'+dir+' '+Math.abs(change).toFixed(1)+'%，'+(change>0?'继续保持当前内容方向！':'建议调整选题和发布策略。')+'</p>');
    }
  }
  var avgViews=reviews.reduce(function(s,r){return s+(Number(r.views)||0)},0)/reviews.length;
  var avgEng=reviews.reduce(function(s,r){return s+getEngagementLevel(r)},0)/reviews.length;
  analysis.push('<p><strong>💡 优化建议：</strong>');
  if(avgEng<2)analysis.push('当前平均互动率'+avgEng.toFixed(2)+'%偏低，建议在视频前3秒设置更强钩子，结尾增加互动引导（提问/投票/关注提示）。');
  else if(avgEng<5)analysis.push('当前平均互动率'+avgEng.toFixed(2)+'%中等，建议尝试评论区置顶互动、增加系列化内容提升粉丝粘性。');
  else analysis.push('当前平均互动率'+avgEng.toFixed(2)+'%表现优秀！建议探索商业合作变现，同时保持内容质量。');
  analysis.push('</p>');
  return analysis.join('');
}

  var panel=document.getElementById('aiAnalysisPanel');
  if(!panel)return;
  panel.innerHTML='<div class="ai-panel"><div class="ai-header"><h3>🤖 AI 智能分析</h3><span class="ai-badge">复盘洞察</span></div><div class="ai-content">'+analyzeReviews()+'</div></div>';

  script+='━━━ 第四幕：总结引导（40-60秒）━━━\n\n';

/* REVIEWS - 数据复盘 */
var accMap={'wsy':'📷 五拾叁','wmxz':'🎬 吴名小卒','zfdg':'📷 追风的光'};
var _reviewSortDesc=true;
function fmtNum(n){n=Number(n)||0;if(n>=10000)return (n/10000).toFixed(1)+'万';return n.toString()}
function getEngagementLevel(r){
  var v=Number(r.views)||0,l=Number(r.likes)||0,c=Number(r.comments)||0,f=Number(r.favorites)||0,s=Number(r.shares)||0;
  if(v===0)return 0;
  return (l+c+f+s)/v*100;
}
function renderReviews(){
  var all=(D.reviews||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  var sumG=document.getElementById('reviewSummary');
  if(all.length){
    var tv=0,tl=0,tc=0,tf=0,ts=0;
    all.forEach(function(r){tv+=Number(r.views)||0;tl+=Number(r.likes)||0;tc+=Number(r.comments)||0;tf+=Number(r.favorites)||0;ts+=Number(r.shares)||0});
    var avgEng=tv>0?((tl+tc+tf+ts)/tv*100).toFixed(2):0;
    sumG.innerHTML='<div class="review-summary">'+
      '<div class="stat-card"><div class="stat-label">复盘作品数</div><div class="stat-value accent">'+all.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">总播放量</div><div class="stat-value blue">'+fmtNum(tv)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">总互动</div><div class="stat-value green">'+fmtNum(tl+tc+tf+ts)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">平均互动率</div><div class="stat-value yellow" style="color:var(--yellow)">'+avgEng+'%</div></div>'+
    '</div>';
  }else{sumG.innerHTML=''}
  var g=document.getElementById('reviewsColumns');
  g.innerHTML=ACCTS.map(function(a){
    var list=all.filter(function(r){return r.acct===a.id});
    return '<div class="acct-col">'+
      '<div class="acct-header" style="background:'+ACCT_BG[a.id]+'">'+
        '<div><span class="acct-icon">'+a.icon+'</span><span class="acct-name">'+e(a.name)+'</span><div class="acct-cat">'+e(a.cat)+'</div></div>'+
        '<span class="acct-count">'+list.length+'</span>'+
      '</div>'+
      '<div class="acct-body">'+
        (list.length?list.map(function(r){
          var eng=getEngagementLevel(r);
          var engCls=eng>=5?'engagement-high':eng>=2?'engagement-mid':'engagement-low';
          return '<div class="acct-mini-card" onclick="openReviewModal(\''+r.id+'\')">'+
            '<div class="mc-title">'+e(r.title)+'</div>'+
            '<div class="mc-stats"><span>'+e(r.date)+'</span><span>'+e(r.platform)+'</span><span>▶ '+fmtNum(r.views)+'</span><span>👍 '+fmtNum(r.likes)+'</span><span>💬 '+fmtNum(r.comments)+'</span></div>'+
            (eng>0?'<div class="mc-stats"><span class="engagement-bar '+engCls+'">互动率 '+eng.toFixed(2)+'%</span></div>':'')+
            (r.reflection?'<div class="mc-content">'+e(r.reflection)+'</div>':'')+
            '<div class="kc-actions" onclick="event.stopPropagation()"><button class="btn btn-danger btn-xs" onclick="deleteReview(\''+r.id+'\')">删除</button></div>'+
          '</div>';
        }).join(''):'<div class="acct-empty">暂无复盘数据</div>')+
      '</div>'+
    '</div>';
  }).join('');
  renderAIAnalysis();
}

/* PROGRESS - 项目进度看板 */
var psMap={'todo':'待开始','doing':'进行中','review':'待审核','done':'已完成'};
var psColor={'todo':'badge-draft','doing':'badge-active','review':'badge-idea','done':'badge-done'};
var psIcon={'todo':'⚪','doing':'🔴','review':'🟡','done':'🟢'};
var psOrder=['todo','doing','review','done'];
function getDaysLeft(deadline){
  if(!deadline)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(deadline);d.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}
function renderProgress(){
  var list=(D.progress||[]);
  var g=document.getElementById('progressColumns');
  g.innerHTML=ACCTS.map(function(a){
    var acctList=list.filter(function(p){return getAcctByProjectName(p.project)===a.id});
    return '<div class="acct-col">'+
      '<div class="acct-header" style="background:'+ACCT_BG[a.id]+'">'+
        '<div><span class="acct-icon">'+a.icon+'</span><span class="acct-name">'+e(a.name)+'</span><div class="acct-cat">'+e(a.cat)+'</div></div>'+
        '<span class="acct-count">'+acctList.length+'</span>'+
      '</div>'+
      '<div class="acct-body">'+
        (acctList.length?acctList.map(function(p){
          var dl=getDaysLeft(p.deadline);
          var dlCls=dl!==null&&dl<0?'overdue':dl!==null&&dl<=3?'near':'';
          var dlText=dl===null?'未设截止日期':dl<0?'已逾期 '+Math.abs(dl)+' 天':dl===0?'今天到期':dl+' 天后到期';
          return '<div class="acct-mini-card" onclick="openProgressModal(\''+p.id+'\')">'+
            '<div class="mc-title">'+e(p.title)+'</div>'+
            '<div class="mc-stats"><span class="badge '+psColor[p.status]+'">'+psMap[p.status]+'</span>'+(p.project?'<span>📂 '+e(p.project)+'</span>':'')+'</div>'+
            '<div class="kc-deadline '+dlCls+'">⏰ '+dlText+'</div>'+
            (p.note?'<div class="mc-content">'+e(p.note)+'</div>':'')+
            '<div class="kc-actions" onclick="event.stopPropagation()">'+
              '<button class="btn btn-ghost btn-xs" onclick="cycleProgress(\''+p.id+'\')">→ 推进</button>'+
              '<button class="btn btn-danger btn-xs" onclick="deleteProgress(\''+p.id+'\')">删除</button>'+
            '</div>'+
          '</div>';
        }).join(''):'<div class="acct-empty">暂无任务</div>')+
      '</div>'+
    '</div>';
  }).join('');
}
var _editingProgress=null;
function openProgressModal(id){
  var p=id?(D.progress||[]).find(function(x){return x.id===id}):null;
  _editingProgress=p;
  var prjOpts=D.projects.map(function(x){return '<option value="'+e(x.name)+'"'+(p&&p.project===x.name?' selected':'')+'>'+e(x.name)+'</option>'}).join('');
  document.getElementById('progressTitle').value=p?p.title:'';
  document.getElementById('progressProject').innerHTML=prjOpts;
  document.getElementById('progressStatus').value=p?p.status:'todo';
  document.getElementById('progressDeadline').value=p?p.deadline:'';
  document.getElementById('progressNote').value=p?p.note:'';
  document.getElementById('progressId').value=p?p.id:'';
  document.getElementById('progressModalT').textContent=p?'编辑任务':'添加任务';
  document.getElementById('progressModal').classList.add('show');
}
function saveProgress(){
  var id=document.getElementById('progressId').value;
  var p={title:document.getElementById('progressTitle').value.trim(),project:document.getElementById('progressProject').value,status:document.getElementById('progressStatus').value,deadline:document.getElementById('progressDeadline').value,note:document.getElementById('progressNote').value.trim()};
  if(!p.title)return alert('请输入任务标题');
  if(id){var idx=(D.progress||[]).findIndex(function(x){return x.id===id});if(idx>=0)D.progress[idx]=Object.assign(D.progress[idx],p,{id:id})}
  else{p.id='pg'+Date.now();D.progress.push(p)}
  sv();US();renderProgress();document.getElementById('progressModal').classList.remove('show');
}
function cycleProgress(id){
  var p=(D.progress||[]).find(function(x){return x.id===id});if(!p)return;
  var i=psOrder.indexOf(p.status);p.status=psOrder[(i+1)%psOrder.length];sv();renderProgress();
}
function deleteProgress(id){if(!confirm('确定删除此任务？'))return;D.progress=D.progress.filter(function(p){return p.id!==id});sv();US();renderProgress();}

/* FINANCE - 财务管理 */
var _financeMonth='all';
function getFinanceMonths(){
  var months={};
  (D.finances||[]).forEach(function(f){if(f.date){var ym=f.date.slice(0,7);months[ym]=true}});
  var arr=Object.keys(months).sort().reverse();

function renderFinances(){
  var all=(D.finances||[]).slice().sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});

  var net=income-expense;
  var sumG=document.getElementById('financeSummary');
  sumG.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px">'+

    '<div class="stat-card"><div class="stat-label">总支出</div><div class="stat-value accent">¥'+fmtMoney(expense)+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">净利润</div><div class="stat-value '+(net>=0?'green':'accent')+'">'+(net>=0?'+':'')+'¥'+fmtMoney(net)+'</div></div>'+
  '</div>';

      var xa=x.acct||getAcctByProjectName(x.project)||'';

    });
    var acctInc=acctList.filter(function(x){return x.type==='income'}).reduce(function(s,x){return s+(Number(x.amount)||0)},0);
    var acctExp=acctList.filter(function(x){return x.type==='expense'}).reduce(function(s,x){return s+(Number(x.amount)||0)},0);
    return '<div class="acct-col">'+
      '<div class="acct-header" style="background:'+ACCT_BG[a.id]+'">'+
        '<div><span class="acct-icon">'+a.icon+'</span><span class="acct-name">'+e(a.name)+'</span><div class="acct-cat">收入 ¥'+fmtMoney(acctInc)+' · 支出 ¥'+fmtMoney(acctExp)+'</div></div>'+
        '<span class="acct-count">'+acctList.length+'</span>'+
      '</div>'+
      '<div class="acct-body">'+
        (acctList.length?acctList.map(function(x){
          return '<div class="acct-mini-card" onclick="openFinanceModal(\''+x.id+'\')">'+
            '<div class="mc-title">'+(x.type==='income'?'<span style="color:var(--green)">+</span>':'<span style="color:var(--accent)">-</span>')+' '+e(x.category||'其他')+'</div>'+
            '<div class="mc-amount" style="color:'+(x.type==='income'?'var(--green)':'var(--accent)')+'">¥'+fmtMoney(x.amount)+'</div>'+
            '<div class="mc-stats"><span>'+e(x.date)+'</span>'+(x.project?'<span>📂 '+e(x.project)+'</span>':'')+'</div>'+
            (x.note?'<div class="mc-content">'+e(x.note)+'</div>':'')+

          '</div>';
        }).join(''):'<div class="acct-empty">暂无记录</div>')+
      '</div>'+
    '</div>';
  }).join('');
}
